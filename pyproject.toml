[project]
name = "obsidian-chat"
version = "0.1.0"
description = "CLI tool for chatting with a local LLM using RAG from your Obsidian vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "httpx",
    "chromadb",
    "sentence-transformers",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
obsidian-chat = "obsidian_chat.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (loading ML models)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsidian_chat"]
